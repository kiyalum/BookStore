{% extends 'base.html' %}

{% block title %}Delete Book{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4 text-center">
            <h2 class="mb-3 text-danger">Delete Book</h2>
            <p>Are you sure you want to delete the book <strong>"{{ book.title }}"</strong>?</p>
            
            <form method="post" class="mt-3">
                {% csrf_token %}
                <a href="{% url 'store:book_list' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
