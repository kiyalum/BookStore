{% extends 'base.html' %}

{% block title %}Payment - Bookstore{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-5 text-center">
            <h2 class="mb-3 fw-bold">Proceed to Payment</h2>
            <p class="lead text-muted">You are about to pay for Order #{{ order.id }}</p>
            <p class="fs-4">Total amount: <b class="text-success">${{ order.get_total_cost }}</b></p>

            <form action="{% url 'orders:payment_process' order.id %}" method="post" class="mt-4">
                {% csrf_token %}
                <button type="submit" class="btn btn-success btn-lg w-100">Pay with Stripe</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
