{% extends 'base.html' %}

{% block title %}Payment Canceled - Bookstore{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-5 text-center">
            <div class="alert alert-warning border-0 mb-4" role="alert">
                <h2 class="alert-heading fw-bold">Payment Canceled</h2>
                <p class="mb-0">Your payment was canceled. You can try again from your cart.</p>
            </div>
            <a href="{% url 'cart:cart_detail' %}" class="btn btn-primary mt-2">Back to Cart</a>
        </div>
    </div>
</div>
{% endblock %}
